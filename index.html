<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mac Ekranı</title>
<style>
  html, body { margin: 0; background: #000; color: #fff; font: 22px/1.3 system-ui, sans-serif; }
  body { width: 600px; height: 600px; overflow: hidden; position: relative; }
  #stage { width: 600px; height: 600px; overflow: hidden; }
  video { width: 600px; height: 600px; object-fit: contain; transform-origin: 0 0; background: #000; }
  #msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
         text-align: center; padding: 24px; background: #000; }
  #hud { position: absolute; left: 8px; bottom: 8px; font-size: 16px; opacity: .7; }
</style>
</head>
<body>
<div id="stage"><video id="v" autoplay muted playsinline></video></div>
<div id="msg">Bağlanıyor…</div>
<div id="hud"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const ROOM = 'dc5ec42ee380281f';          // share.html ile aynı olmalı
const SENDER_ID = 'dz-' + ROOM + '-sender';
const VIEWER_ID = 'dz-' + ROOM + '-viewer-' + Math.random().toString(36).slice(2, 8);

const msg = document.getElementById('msg');
const v = document.getElementById('v');
const hud = document.getElementById('hud');
const setMsg = t => { msg.style.display = t ? 'flex' : 'none'; msg.textContent = t || ''; };

let peer, conn, retry;
function connect() {
  clearTimeout(retry);
  peer = new Peer(VIEWER_ID);
  peer.on('call', call => {
    call.answer();
    call.on('stream', s => { v.srcObject = s; v.play().catch(() => {}); setMsg(''); });
    call.on('close', () => { setMsg('Paylaşım bitti, bekleniyor…'); });
  });
  peer.on('open', () => {
    conn = peer.connect(SENDER_ID, { reliable: true });
    conn.on('open', () => setMsg('Bağlandı, yayın bekleniyor…'));
    conn.on('close', () => { setMsg('Bağlantı koptu, yeniden deneniyor…'); restart(); });
    conn.on('error', restart);
  });
  peer.on('error', e => { setMsg('Mac tarafı hazır değil (' + e.type + '), yeniden deneniyor…'); restart(); });
}
function restart() {
  try { peer && peer.destroy(); } catch (e) {}
  retry = setTimeout(connect, 3000);
}
connect();

// Yakınlaştırma: Enter/tıklama = 1x → 2x → 3x. Ok tuşları = kaydır.
let zoom = 1, px = 0, py = 0;
function apply() {
  const max = 600 * (zoom - 1);
  px = Math.max(-max, Math.min(0, px));
  py = Math.max(-max, Math.min(0, py));
  v.style.transform = `translate(${px}px, ${py}px) scale(${zoom})`;
  hud.textContent = zoom > 1 ? zoom + 'x' : '';
}
const ZOOMS = [1, 2, 3, 4];
function cycle() {
  const i = ZOOMS.indexOf(zoom);
  zoom = ZOOMS[(i + 1) % ZOOMS.length];
  if (zoom === 1) { px = py = 0; }
  apply();
}
document.addEventListener('click', cycle);
document.addEventListener('keydown', e => {
  const step = 80;
  if (e.key === 'Enter') cycle();
  else if (zoom > 1) {
    if (e.key === 'ArrowLeft') px += step;
    else if (e.key === 'ArrowRight') px -= step;
    else if (e.key === 'ArrowUp') py += step;
    else if (e.key === 'ArrowDown') py -= step;
    else return;
    e.preventDefault(); apply();
  }
});
</script>
</body>
</html>
