<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mac Ekranı</title>
<style>
  html, body { margin: 0; background: #000; color: #fff; font: 22px/1.3 system-ui, sans-serif; }
  body { width: 600px; height: 600px; overflow: hidden; position: relative; }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  video { position: absolute; left: 0; top: 0; transform-origin: 0 0; background: #000; image-rendering: auto; }
  #msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
         text-align: center; padding: 24px; background: #000; }
  #hud { position: absolute; left: 8px; bottom: 8px; font-size: 16px; opacity: .7; text-shadow: 0 0 4px #000; }
</style>
</head>
<body>
<div id="stage"><video id="v" autoplay muted playsinline></video></div>
<div id="msg">Bağlanıyor…</div>
<div id="hud"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const ROOM = 'dc5ec42ee380281f';          // share.html ile aynı olmalı
const SENDER_ID = 'dz-' + ROOM + '-sender';
const VIEWER_ID = 'dz-' + ROOM + '-viewer-' + Math.random().toString(36).slice(2, 8);
const SIZE = 600;

const msg = document.getElementById('msg');
const v = document.getElementById('v');
const hud = document.getElementById('hud');
const setMsg = t => { msg.style.display = t ? 'flex' : 'none'; msg.textContent = t || ''; };

let peer, conn, retry;
function connect() {
  clearTimeout(retry);
  peer = new Peer(VIEWER_ID);
  peer.on('call', call => {
    call.answer();
    call.on('stream', s => { v.srcObject = s; v.play().catch(() => {}); setMsg(''); });
    call.on('close', () => { setMsg('Paylaşım bitti, bekleniyor…'); });
  });
  peer.on('open', () => {
    conn = peer.connect(SENDER_ID, { reliable: true });
    conn.on('open', () => setMsg('Bağlandı, yayın bekleniyor…'));
    conn.on('close', () => { setMsg('Bağlantı koptu, yeniden deneniyor…'); restart(); });
    conn.on('error', restart);
  });
  peer.on('error', e => { setMsg('Mac tarafı hazır değil (' + e.type + '), yeniden deneniyor…'); restart(); });
}
function restart() {
  try { peer && peer.destroy(); } catch (e) {}
  retry = setTimeout(connect, 3000);
}
connect();

// ---- Görünüm: sığdır / boşluksuz doldur / 2x / 3x / 4x ----
// İçerik, en-boy oranı korunarak 600x600'e sığdırılır (cw x ch), sonra z ile büyütülür.
let cw = SIZE, ch = SIZE, z = 1, px = 0, py = 0, levels = [1], li = 0;

function layout() {
  const vw = v.videoWidth, vh = v.videoHeight;
  if (!vw || !vh) return;
  const f = Math.min(SIZE / vw, SIZE / vh);
  cw = vw * f; ch = vh * f;
  v.style.width = cw + 'px';
  v.style.height = ch + 'px';
  const fill = Math.max(SIZE / cw, SIZE / ch);          // boşluksuz doldurma
  levels = [1];
  if (fill > 1.05) levels.push(fill);
  [2, 3, 4].forEach(l => { if (l > levels[levels.length - 1] + 0.1) levels.push(l); });
  li = 0; z = 1; px = py = 0;
  apply();
}
v.addEventListener('loadedmetadata', layout);
v.addEventListener('resize', layout);

function clampAxis(p, size) {
  return size <= SIZE ? (SIZE - size) / 2 : Math.max(SIZE - size, Math.min(0, p));
}
function apply() {
  px = clampAxis(px, cw * z);
  py = clampAxis(py, ch * z);
  v.style.transform = `translate(${px}px, ${py}px) scale(${z})`;
  hud.textContent = li === 0 ? '' : (li === 1 && levels.length > 1 && levels[1] < 2 ? 'dolgu' : z.toFixed(1) + 'x');
}
function cycle() {
  // Yakınlaştırırken ekranın ortasındaki noktayı koru
  const cx = (SIZE / 2 - px) / z, cy = (SIZE / 2 - py) / z;
  li = (li + 1) % levels.length;
  z = levels[li];
  px = SIZE / 2 - cx * z;
  py = SIZE / 2 - cy * z;
  if (li === 0) { px = py = 0; }
  apply();
}
document.addEventListener('click', cycle);
document.addEventListener('keydown', e => {
  const step = 90;
  if (e.key === 'Enter') { cycle(); return; }
  const m = { ArrowLeft: [step, 0], ArrowRight: [-step, 0], ArrowUp: [0, step], ArrowDown: [0, -step] }[e.key];
  if (!m) return;
  e.preventDefault();
  px += m[0]; py += m[1];
  apply();
});
</script>
</body>
</html>
